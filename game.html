// 事件
// ════════════════════════════════════════════════════════════════════
document.addEventListener('click', e => {
  // 视角切换按钮（自己一个人玩时来回切）
  const sw = e.target.closest('[data-switch]');
  if (sw) { setView(sw.dataset.switch); return; }

  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = { type: el.dataset.act };
  if (el.dataset.card) a.card = el.dataset.card;
  if (el.dataset.pid) a.pid = el.dataset.pid;
  if (el.dataset.target) a.target = el.dataset.target;
  if (a.type==='pick') a.side = MY;
  if (a.type==='bench') a.side = MY;
  if (a.type==='giveup') { dispatch({ type:'giveup' }, true); return; }
  if (a.type==='roll') { rollWithAnim(); return; }
  dispatch(a, true);
});

// 掷骰动画 + 结算。抽成函数，因为「防守方决定完干扰 → 骰子自动开始判定」
// 是 Ethan 明确要的节奏：所有修正已锁定，再点一下「掷 d20」是纯粹的多余操作。
let rolling = false;
// 动画时长。自动化测试里设 window.__fastDice = true 可以关掉，
// 否则跑一局 20 回合要等 20 秒纯动画，playtest 会超时。
function diceMs() { return window.__fastDice ? 30 : 940; }
function rollWithAnim() {
  if (rolling || !S || S.phase!=='roll') return;
  rolling = true;
  const die = $('die'), val = $('dieval');
  die.className = 'die rolling';
  let spin = setInterval(()=>{ val.textContent = 1 + Math.floor(Math.random()*20); }, 62);
  setTimeout(()=>{
    clearInterval(spin);
    die.classList.remove('rolling'); die.classList.add('land');
    rolling = false;
    dispatch({ type:'roll' }, true);
    setTimeout(()=>die.classList.remove('land'), 460);
  }, diceMs());
}
// 进入 roll 阶段就自动掷（含从对手窗口同步过来的情况）
function autoRoll() {
  if (S && S.phase==='roll' && !rolling) rollWithAnim();
}
$('resetbtn').onclick = () => { localStorage.removeItem(LS); CH.postMessage({kind:'reset'}); location.reload(); };

// ══════════════════════════════════════════════════════════════════
// 拖放出牌
// 设计要点：
//  - 拖起来时把「合法落点」点亮，非法落点不响应 —— 玩家不用猜往哪拖
//  - 落点语义按牌类分：进攻牌拖到进攻位、防守牌拖到防守位、战术牌拖到桌面
//  - 点击出牌同时保留（拖放是加分项，不是唯一出路）
// ══════════════════════════════════════════════════════════════════
let DRAG = null;   // { kind, card, el }

// 每类牌在当前阶段的合法落点与文案
function dropTargetFor(kind) {
  if (!S) return null;
  const off = S.offSide, def = other(off);
  // 进攻牌在 shot 阶段可出，也允许在 tactic 阶段直接出（= 不打战术，直接进攻）
  if (kind==='off' && (S.phase==='shot' || S.phase==='tactic') && MY===off)
    return { el:'duelOff', hint: S.phase==='tactic' ? '直接进攻（跳过战术）' : '出手', act:'shot' };
  if (kind==='def' && S.phase==='defcard' && MY===def)
    return { el:'duelDef', hint:'干扰这次出手', act:'defcard' };
  if (kind==='tac' && S.phase==='tactic' && MY===off)
    return { el:'played', hint:'打出战术', act:'tactic' };
  if (kind==='tac' && S.phase==='respond' && MY===def)
    return { el:'played', hint:'打出应对', act:'respond' };
  return null;
}

function armDrop(kind) {
  const t = dropTargetFor(kind);
  document.querySelectorAll('.dropzone').forEach(z=>z.classList.remove('armed','over'));
  if (!t) return null;
  const zone = $(t.el);
  zone.classList.add('armed');
  const hintEl = zone.querySelector('.dzhint');
  if (hintEl) hintEl.textContent = t.hint;
  return t;
}
function disarmDrop() {
  document.querySelectorAll('.dropzone').forEach(z=>z.classList.remove('armed','over'));
}

document.addEventListener('dragstart', e => {
  const card = e.target.closest('.card[draggable="true"]');
  if (!card) return;
  DRAG = { kind: card.dataset.kind, card: card.dataset.cardid, el: card };
  card.classList.add('dragging');
  // Firefox 需要 setData 才会真正开始拖
  try { e.dataTransfer.setData('text/plain', DRAG.card); } catch {}
  e.dataTransfer.effectAllowed = 'move';
  armDrop(DRAG.kind);
});
document.addEventListener('dragend', () => {
  if (DRAG?.el) DRAG.el.classList.remove('dragging');
  DRAG = null; disarmDrop();
});
document.addEventListener('dragover', e => {
  if (!DRAG) return;
  const t = dropTargetFor(DRAG.kind);
  if (!t) return;
  const zone = e.target.closest('#' + t.el);
  if (!zone) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  zone.classList.add('over');
});
document.addEventListener('dragleave', e => {
  const zone = e.target.closest('.dropzone');
  if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove('over');
});
document.addEventListener('drop', e => {
  if (!DRAG) return;
  const t = dropTargetFor(DRAG.kind);
  if (!t) return;
  const zone = e.target.closest('#' + t.el);
  if (!zone) return;
  e.preventDefault();
  const a = { type: t.act, card: DRAG.card };
  // 点哥战术需要目标
  if (DRAG.card==='hunt') {
    const tg = ROSTERS[other(MY)].players.find(x=>ST(other(MY),x.id).cur>=1);
    if (!tg) { disarmDrop(); return; }
    a.target = tg.id;
  }
  if (DRAG.el) DRAG.el.classList.remove('dragging');
  DRAG = null; disarmDrop();
  dispatch(a, true);
});

// ── 视角切换：单窗口自己打自己时用（不 reload，避免与另一窗口状态打架）
function setView(side) {
  MY = side;
  const u = new URL(location.href); u.searchParams.set('side', side);
  history.replaceState(null, '', u);
  render();
}
$('vbCLE').onclick = () => setView('CLE');
$('vbGSW').onclick = () => setView('GSW');
$('openopp').onclick = () => {
  const opp = other(MY);
  const u = new URL(location.href); u.searchParams.set('side', opp);
  window.open(u.href, 'qiyong-' + opp, 'width=1280,height=860');
};
// 当前该谁操作
function whoActs() {
  const off = S.offSide, def = other(off);
  switch (S.phase) {
    case 'select':  return S.picks.CLE ? (S.picks.GSW ? null : 'GSW') : 'CLE';
    case 'tactic':  return off;
    case 'respond': return def;
    case 'shot':    return off;
    case 'defcard': return def;
    case 'roll':    return off;
    case 'result':  return off;
    default:        return null;
  }
}

CH.onmessage = ev => {
  const m = ev.data;
  if (m.kind==='action') { S = JSON.parse(localStorage.getItem(LS)) || S; dispatch(m.action, false); }
  else if (m.kind==='reset') location.reload();
  else if (m.kind==='newmatch') { S = m.state; save(); render(); $('veil').classList.add('hide'); }
  else if (m.kind==='whoami') CH.postMessage({ kind:'iam', side:MY });
};

// ─────────────────────────── 开局
function showSetup() {
  const v = $('veil'); v.classList.remove('hide');
  const cs = Object.entries(COACHES);
  $('veilpane').innerHTML = `
    <div class="kick">2017 NBA FINALS · CARD BATTLE</div>
    <h1>骑勇大战</h1>
    <p>1v1 斗将 · d20 判定 · 先得 ${TUNING.targetScore} 分。
      场上每方只有 1 人，需要第二个人的动作（空接、包夹）由卡牌临时翻出。
      <br><b style="color:var(--hot)">分屏玩法</b>：两个窗口分别打开
      <span class="num" style="font-size:12px">?side=CLE</span> 与
      <span class="num" style="font-size:12px">?side=GSW</span>，选人阶段互相看不到。</p>
    <div style="font-size:11px;letter-spacing:.18em;color:var(--faint);margin-bottom:8px">选择你的球队</div>
    <div class="pick">
      <button class="pk" data-side="CLE"><div class="t2">克利夫兰骑士</div>
        <div class="d2">詹姆斯 / 欧文 / 勒夫 / JR / TT<br>2017 总决赛真实首发 · 主场 DC -2</div></button>
      <button class="pk" data-side="GSW"><div class="t2">金州勇士</div>
        <div class="d2">库里 / 克莱 / 杜兰特 / 格林 / 伊戈达拉<br>死亡五小 · 属性全面占优</div></button>
    </div>
    <div style="font-size:11px;letter-spacing:.18em;color:var(--faint);margin:16px 0 8px">骑士教练</div>
    <div class="coachpick" id="cp1">${cs.map(([k,c])=>
      `<button class="pk" data-coach1="${k}"><div class="t2" style="font-size:16px">${esc(c.zh)}</div>
        <div class="d2">${esc(c.system)}</div></button>`).join('')}</div>
    <div style="font-size:11px;letter-spacing:.18em;color:var(--faint);margin:16px 0 8px">勇士教练</div>
    <div class="coachpick" id="cp2">${cs.map(([k,c])=>
      `<button class="pk" data-coach2="${k}"><div class="t2" style="font-size:16px">${esc(c.zh)}</div>
        <div class="d2">${esc(c.system)}</div></button>`).join('')}</div>
    <button class="btn" id="startbtn" disabled style="opacity:.4">开始比赛</button>`;
  let side = MY, c1 = 'lue', c2 = 'kerr';
  const mark = (sel, val, attr) => {
    document.querySelectorAll(`[${attr}]`).forEach(b=>{
      b.style.borderColor = b.getAttribute(attr)===val ? 'var(--hot)' : '';
    });
  };
  mark(null,c1,'data-coach1'); mark(null,c2,'data-coach2');
  const sync = () => {
    document.querySelectorAll('[data-side]').forEach(b=>{
      b.style.borderColor = b.dataset.side===side ? 'var(--hot)' : '';
    });
    const btn = $('startbtn');
    btn.disabled = !side; btn.style.opacity = side ? 1 : .4;
  };
  if (side) sync();
  $('veilpane').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.side) { side = b.dataset.side; sync(); }
    if (b.dataset.coach1) { c1 = b.dataset.coach1; mark(null,c1,'data-coach1'); }
    if (b.dataset.coach2) { c2 = b.dataset.coach2; mark(null,c2,'data-coach2'); }
    if (b.id==='startbtn' && side) {
      MY = side;
      const u = new URL(location.href); u.searchParams.set('side', side);
      history.replaceState(null,'',u);
      S = freshState(Date.now() % 2147483647, c1, c2);
      save(); CH.postMessage({ kind:'newmatch', state:S });
      render();
      showOpenSecond(other(side));
    }
  };
}

// 开局后引导打开对手窗口。file:// 下 window.open 可能被拦，所以同时给可复制地址。
function showOpenSecond(oppSide) {
  const v = $('veil');
  v.classList.remove('hide');
  const url = new URL(location.href);
  url.searchParams.set('side', oppSide);
  const href = url.href;
  $('veilpane').innerHTML = `
    <div class="kick">SPLIT SCREEN</div>
    <h1 style="font-size:38px;letter-spacing:2px">再开一个窗口</h1>
    <p>这一局你执 <b style="color:var(--hot)">${ROSTERS[MY].zh}</b>。
      对手（${ROSTERS[oppSide].zh}）需要一个<b style="color:var(--hot)">独立窗口</b> —— 选人阶段双方互相看不到，
      所以不能在同一个窗口里进行。两个窗口共享同一场比赛，出牌实时同步。</p>
    <div class="pick" style="grid-template-columns:1fr">
      <button class="pk" id="openbtn" style="border-color:var(--hot)">
        <div class="t2">打开 ${ROSTERS[oppSide].zh} 窗口</div>
        <div class="d2">弹出一个新窗口。若被浏览器拦截，请复制下面的地址手动打开。</div></button>
    </div>
    <div style="font-size:11px;letter-spacing:.18em;color:var(--faint);margin:14px 0 6px">对手窗口地址（点击复制）</div>
    <div class="num" id="urlbox" style="background:var(--ink2);border:1px solid var(--line2);
      padding:11px 13px;font-size:11.5px;word-break:break-all;line-height:1.6;cursor:pointer">${esc(href)}</div>
    <div style="display:flex;gap:9px;margin-top:16px;flex-wrap:wrap">
      <button class="btn" id="donebtn" style="margin-top:0">已打开对手窗口，开始</button>
      <button class="btn gh" id="solobtn" style="margin-top:0">我一个人玩（用侧栏切视角）</button>
    </div>`;
  $('openbtn').onclick = () => {
    const w = window.open(href, '_blank', 'width=1500,height=950');
    if (!w) alert('浏览器拦截了弹窗。请点击下面的地址复制，然后在新窗口粘贴打开。');
  };
  $('urlbox').onclick = () => {
    const box = $('urlbox');
    navigator.clipboard?.writeText(href).then(
      ()=>{ box.style.borderColor='var(--win)'; setTimeout(()=>box.style.borderColor='',900); },
      ()=>{ const r=document.createRange(); r.selectNodeContents(box);
            getSelection().removeAllRanges(); getSelection().addRange(r); });
  };
  $('donebtn').onclick = () => { v.classList.add('hide'); render(); };
  $('solobtn').onclick = () => { v.classList.add('hide'); render(); };
}

// 第二个窗口：本机已有比赛在跑 → 这里是「加入」而不是「新建」。
// 之前的 bug：不带 ?side= 打开会走 showSetup()，把第一个窗口的比赛冲掉。
function showJoin(st) {
  const v = $('veil'); v.classList.remove('hide');
  const c1 = COACHES[st.sides.CLE.coach], c2 = COACHES[st.sides.GSW.coach];
  $('veilpane').innerHTML = `
    <div class="kick">JOIN MATCH</div>
    <h1 style="font-size:38px;letter-spacing:2px">加入进行中的比赛</h1>
    <p>本机已有一场比赛：<b style="color:var(--hot)">${st.sides.CLE.score} — ${st.sides.GSW.score}</b>，第 ${st.turn} 回合。
      <br>骑士教练 ${esc(c1.zh)} · 勇士教练 ${esc(c2.zh)}。选择你要执哪一边。</p>
    <div class="pick">
      <button class="pk" data-join="CLE"><div class="t2">克利夫兰骑士</div>
        <div class="d2">詹姆斯 / 欧文 / 勒夫 / JR / TT</div></button>
      <button class="pk" data-join="GSW"><div class="t2">金州勇士</div>
        <div class="d2">库里 / 克莱 / 杜兰特 / 格林 / 伊戈达拉</div></button>
    </div>
    <button class="btn gh" id="newbtn">放弃这场，重新开局</button>`;
  $('veilpane').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.join) {
      MY = b.dataset.join;
      const u = new URL(location.href); u.searchParams.set('side', MY);
      history.replaceState(null,'',u);
      S = st; v.classList.add('hide'); render();
    }
    if (b.id==='newbtn') { localStorage.removeItem(LS); CH.postMessage({kind:'reset'}); location.reload(); }
  };
}

// 调试桥：用于自动化测试与数值诊断（构造任意局面、逐项拆解 DC）。
// 只读+dispatch，不改变任何游戏规则。
window.__S = () => S;
window.__MY = () => MY;     // playtest 用：SOLO 模式下 MY 不一定等于 URL ?side
window.__dispatch = (a) => dispatch(a, true);
window.__calcDC = (shot) => calcDC(shot);
window.__setView = (side) => setView(side);

// 启动
const saved = localStorage.getItem(LS);
if (saved) { try { S = JSON.parse(saved); } catch { S = null; } }
if (S && S.over) { render(); }              // 终局：直接显示结果
else if (S && MY) { render(); }             // 已知身份 + 有比赛 → 直接玩
else if (S) { showJoin(S); }                // 有比赛但不知身份 → 加入，不要新建
else { showSetup(); }                        // 全新 → 开局设置
</script>
